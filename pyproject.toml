[project]
name = "accountcontext-client"
version = "0.1.0"
description = "accountcontext portable client"
requires-python = ">=3.11"
dependencies = ["observecontext-client @ git+https://github.com/pocketcontext/observecontext.git@49cf708640b6275a5e89107d097b2a1ce2d262fa"]

[project.scripts]
accountcontext = "accountcontext_client.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/accountcontext_client"]
